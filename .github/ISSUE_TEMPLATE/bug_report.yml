name: Bug report
description: Something in StykAnimate doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please check that the bug isn't already reported, and that it still happens in the latest version.
  - type: input
    id: version
    attributes:
      label: StykAnimate version
      description: Shown in the About dialog.
      placeholder: "1.2.5"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where do you use StykAnimate?
      options:
        - Windows (Setup)
        - Windows (Portable)
        - Linux (AppImage)
        - Browser (app.stykanimate.com)
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system, browser and graphics card
      placeholder: "Windows 11, NVIDIA RTX 3060"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a new project
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Screenshots, recordings or project files
      description: Drag files here. A small .styk or .piv file that shows the problem helps a lot. Only share files you're allowed to share.
